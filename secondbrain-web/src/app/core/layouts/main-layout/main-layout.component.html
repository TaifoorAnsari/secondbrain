<div class="layout">

  <!-- Overlay (only visible on mobile when sidebar is open) -->
  @if (layout.sidebarOpen()) {
    <div
      class="overlay"
      (click)="layout.closeSidebar()">
    </div>
  }

  <aside
    class="sidebar"
    [class.open]="layout.sidebarOpen()">

    <app-sidebar />

  </aside>

  <div class="content">

    <header class="header">
      <app-header />
    </header>

    <main class="page">
      <router-outlet />
    </main>

  </div>

</div>
