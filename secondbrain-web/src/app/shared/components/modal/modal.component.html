@if (open()) {

<div class="backdrop" (click)="onBackdropClick()">

    <div class="modal" (click)="$event.stopPropagation()">

        <div class="modal-header">

            <h2>{{ title() }}</h2>

            <button
                class="close-btn"
                (click)="onClose()">

                ✕

            </button>

        </div>

        <div class="modal-body">

            <ng-content></ng-content>

        </div>

    </div>

</div>

}
