
  <div class="notes-list">
    @for (note of notes(); track note.id) {
      <article class="note">
        <div class="note__icon">
          <span class="material-symbols-rounded"> description </span>
        </div>

        <div class="note__body">
          <h3>
            {{ note.title }}
          </h3>

          <span>
            {{ note.updatedAt }}
          </span>

          <p>
            {{ note.preview }}
          </p>
        </div>
      </article>
    }
  </div>
