<div class="timeline-page">
  <div class="timeline-top">
    <div class="timeline-heading">
      <span class="eyebrow">Timeline</span>
      <h1>Memory Timeline</h1>
      <p>Track every memory, event, meeting, and journal entry from one central stream.</p>
    </div>

    <button class="add-btn">+ Add Timeline Event</button>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Search Person, Company, Event..." />
  </div>

  <div class="timeline">
    <div class="timeline-line"></div>

    <div class="timeline-list">
      <div class="timeline-item" *ngFor="let item of timeline">
        <div class="timeline-marker">
          <div class="timeline-dot"></div>
          <div class="timeline-icon" [ngClass]="item.type">{{ item.icon }}</div>
        </div>

        <div class="timeline-card">
          <div class="timeline-card-header">
            <span class="timeline-badge">{{ item.label }}</span>
            <span class="timeline-time">{{ item.datetime }}</span>
          </div>

          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>

          <div class="tags">
            <span *ngFor="let tag of item.tags">{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
